server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: env-monitor-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:env_mon}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 28800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-print: false

# 报警引擎：数据类三条规则的扫描窗口与周期
alarm:
  eval:
    # 超标：回看 10 分钟，覆盖"连续 3 分钟超限"并留扫描间隔余量
    over-limit-window-minutes: 10
    # 恒值：回看 30 分钟，容纳最近 10 条分钟数据
    dead-lookback-minutes: 30
    # 缺数：只在最近 2 天有数据的因子里判定，避免扫全表
    missing-lookback-days: 2
  job:
    enabled: true
    # 每 5 分钟一轮（2/7/12/... 分）
    cron: "0 2/5 * * * ?"

# 运维证据链：任务超期打标周期
ops:
  job:
    enabled: true
    cron: "0 4/5 * * * ?"

# 消息中心：密钥/网关一律走环境变量，未配置时通道记 SKIPPED 并降级到站内消息
notify:
  feishu:
    webhook-url: ${FEISHU_WEBHOOK_URL:}
    enabled: ${FEISHU_ENABLED:true}
  sms:
    gateway-url: ${SMS_GATEWAY_URL:}
  wxa:
    gateway-url: ${WXA_GATEWAY_URL:}
  max-retry: 3
  day-start-hour: 8
  day-end-hour: 20
  p1-first-minutes: 15
  p1-second-minutes: 30
  p2-first-minutes: 30
  detail-url: ${NOTIFY_DETAIL_URL:}
  job:
    enabled: true
    cron: "0 3/5 * * * ?"
  # 接入层产生的参数变更事件由 API 进程补发首报
  param-job:
    enabled: true
    cron: "0 1/5 * * * ?"

# 附录 G 判定阈值与时序聚合任务
ts:
  calc:
    # 小时值有效：有效分钟数 >= 45
    hour-min-valid-minutes: 45
    # 日均值有效：有效小时数 >= 24 * 0.75 = 18
    day-valid-rate: 0.75
    # 实时值回看窗口，设备离线时仍能看到最后一次上报
    realtime-window-hours: 24
    # 负值修约：a21002（SO₂）落在 (-15, 0) 时按 0.5 参与统计，可按因子继续加
    negative-fix:
      a21002:
        lower-bound: -15
        target: 0.5
  job:
    enabled: true
    # 每 10 分钟滚动重算最近 2 个已完成小时，兜住补传/乱序
    hour-window-hours: 2
    # 启动后补算最近 24 小时，避免升级部署后等待整点
    catch-up-hours: 24

logging:
  level:
    root: info
    com.envmon: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
