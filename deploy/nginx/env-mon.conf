# ============================================================
# env-monitor 前端静态资源 + 后端 API 反向代理
#
# 用法（Debian/Alma 的 nginx 默认配置结构）：
#   1) 构建前端： cd web && npm ci && npm run build
#   2) 产物： cp -r web/dist/* /usr/share/nginx/html/
#   3) 本文件： cp deploy/nginx/env-mon.conf /etc/nginx/conf.d/env-mon.conf
#   4) 校验并重载： nginx -t && nginx -s reload
#
# 为什么安全头写在 nginx：
#   后端的 SecurityHeadersFilter 只作用在 /api（Servlet 过滤器），
#   静态资源不过后端，CSP / nosniff 这些必须由入口层补。
#
# 上传体积：运维记录带现场照片，默认放到 20m；
# 与后端 spring.servlet.multipart.max-file-size 保持一致。
# ============================================================

upstream env_mon_api {
    # 多实例时在这里列全，nginx 默认轮询
    server 127.0.0.1:8080;
    keepalive 32;
}

gzip on;
gzip_vary on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传（现场照片/视频）与后端 multipart 限制保持一致
    client_max_body_size 20m;

    # ---------- 安全响应头（对所有响应生效） ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # CSP 说明：
    #   script-src 'self'          —— 构建产物没有内联脚本，不需要 unsafe-inline/eval
    #   style-src 'unsafe-inline'  —— Element Plus 运行时会写内联 style（组件宽高/进度条）
    #   img-src data: blob:        —— 二维码、图片预览
    #   connect-src 'self'         —— axios 走同源 /api
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://env_mon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HJ212 侧是长连接，但 API 侧都是短请求；给足慢查询窗口
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 审计要用真实客户端 IP，反代必须传 X-Forwarded-For；
        # 后端 AuditAspect 取第一个地址，所以不要在这里改写该头
        proxy_buffering off;
    }

    # ---------- 带 hash 的构建产物：长缓存 ----------
    location /assets/ {
        # 只用 expires，不写 add_header：
        # nginx 的 add_header 一旦在 location 出现，会整体覆盖 server 级的安全头
        expires 1y;
        try_files $uri =404;
    }

    # ---------- SPA 入口：不缓存，保证发版立即生效 ----------
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        # history 路由回退：刷新 /station/123 不能 404
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
